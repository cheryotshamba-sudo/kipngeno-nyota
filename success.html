<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:'Poppins',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
}

.container{
    width:100%;
    max-width:420px;
}

.card{
    width:100%;
    background:#101010;
    border:1px solid #D4AF37;
    border-radius:16px;
    padding:28px 20px;
    text-align:center;
    box-shadow:0 0 25px rgba(212,175,55,0.18);
}

.success{
    width:70px;
    height:70px;
    margin:0 auto 16px;
    border-radius:50%;
    background:#D4AF37;
    color:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    box-shadow:0 0 20px rgba(212,175,55,0.35);
}

h1{
    color:#D4AF37;
    font-size:25px;
    font-weight:700;
    margin-bottom:16px;
}

p{
    color:#E8E8E8;
    font-size:14px;
    line-height:1.6;
    margin-bottom:13px;
}

b{
    color:#D4AF37;
}

button{
    width:100%;
    border:none;
    border-radius:9px;
    padding:14px;
    margin-top:10px;
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#050505;
    font-family:'Poppins',sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    background:linear-gradient(135deg,#E5C158,#B8860B);
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="success">✓</div>

        <h1>Payment Successful</h1>

        <p>
            Congratulations <b><span id="name">Applicant</span></b>!
        </p>

        <p>
            Your payment has been received successfully.
        </p>

        <p>
            Your NYOTA FUNDS request has been submitted successfully.
        </p>

        <p>
            Our team is verifying your application. You will receive further communication after verification is complete.
        </p>

        <button onclick="finish()">
            Finish
        </button>

    </div>

</div>

<script>

const applicant =
    localStorage.getItem("fullName") ||
    localStorage.getItem("applicantName") ||
    "Applicant";

document.getElementById("name").textContent = applicant;

function finish(){
    alert("Thank you for choosing NYOTA FUNDS.");
}

</script>

</body>
</html>
