
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYOTA FUNDS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px 10px;
    font-family: Arial, sans-serif;
    background: #0B0217;
    color: #fff;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
}

.card {
    width: 100%;
    background: linear-gradient(
        145deg,
        rgba(255,255,255,0.09),
        rgba(255,255,255,0.035)
    );
    padding: 22px 18px 18px;
    border-radius: 18px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
}

h1 {
    text-align: center;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    margin: 2px 0 16px;
}

p {
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
    color: rgba(255,255,255,0.72);
}

.amount {
    background: rgba(155,53,255,0.08);
    border: 1px solid rgba(155,53,255,0.18);
    border-radius: 12px;
    padding: 14px 10px;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    color: #fff;
    margin: 18px 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 700;
    color: rgba(255,255,255,0.88);
}

input {
    width: 100%;
    padding: 14px 12px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    font-size: 16px;
    background: rgba(255,255,255,0.07);
    color: #fff;
    outline: none;
}

input:focus {
    border-color: rgba(169,72,255,0.8);
    box-shadow: 0 0 0 3px rgba(155,55,255,0.12);
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 17px;
    background: linear-gradient(135deg, #9B35FF, #6C1DCE);
    color: white;
    border: none;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(137,43,226,0.30);
}

button:hover {
    background: linear-gradient(135deg, #A844FF, #7625DC);
}

button:active {
    transform: scale(.98);
}

button:disabled {
    background: rgba(255,255,255,0.25);
    cursor: not-allowed;
    box-shadow: none;
}

#stkMessage {
    min-height: 20px;
    margin-top: 13px;
    color: #B86CFF;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
}

/* FLOATING WHATSAPP BUTTON */
.floating-whatsapp {
    position: fixed;
    right: 18px;
    bottom: 20px;
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #25D366;
    color: #fff;
    border-radius: 50%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    z-index: 99999;
    text-decoration: none;
    transition: transform .2s ease;
    -webkit-tap-highlight-color: transparent;
}

.floating-whatsapp:hover {
    transform: scale(1.08);
}

.floating-whatsapp:active {
    transform: scale(.95);
}

.floating-whatsapp svg {
    display: block;
    width: 34px;
    height: 34px;
    fill: currentColor;
}

@media (max-width: 360px) {
    body {
        padding: 10px 7px;
    }

    .card {
        padding: 18px 13px 15px;
        border-radius: 15px;
    }

    h1 {
        font-size: 20px;
    }

    button {
        padding: 14px;
        font-size: 15px;
    }

    .floating-whatsapp {
        width: 54px;
        height: 54px;
        right: 13px;
        bottom: 15px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Processing Fee</h1>

        <p>
            Welcome, <strong><span id="name"></span></strong>
        </p>

        <p>
            To continue with your NYOTA Fund application,
            please complete the processing fee payment below.
        </p>

        <div class="amount" id="feeAmount">
            Processing Fee: KSh 350
        </div>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" readonly>

        <label for="phone">M-PESA Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="2547XXXXXXXX"
        >

        <button id="payBtn" onclick="payNow()">
            Pay Processing Fee
        </button>

        <p id="stkMessage"></p>

    </div>
</div>

<!-- FLOATING WHATSAPP BUTTON -->
<a
    class="floating-whatsapp"
    href="https://wa.me/254737421301?text=Hello%2C%20NYOTA%20FUNDS%20Support.%20I%20need%20help."
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Contact NYOTA FUNDS on WhatsApp"
    title="Chat with NYOTA FUNDS on WhatsApp"
>
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M16 .5A15.4 15.4 0 0 0 2.7 23.7L.5 31.5l8-2.1A15.5 15.5 0 1 0 16 .5Zm0 28.1a12.6 12.6 0 0 1-6.4-1.7l-.5-.3-4.7 1.2 1.3-4.6-.3-.5A12.6 12.6 0 1 1 16 28.6Zm6.9-9.4c-.4-.2-2.2-1.1-2.6-1.2-.4-.1-.6-.2-.9.2-.3.4-1 1.2-1.2 1.4-.2.3-.5.3-.9.1-.4-.2-1.6-.6-3.1-2-1.1-1-1.9-2.3-2.1-2.7-.2-.4 0-.6.2-.8l.6-.7c.2-.2.3-.4.4-.7.1-.2 0-.5 0-.7l-1.2-2.8c-.3-.7-.6-.6-.9-.6h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.3s1.4 3.8 1.6 4.1c.2.3 2.8 4.3 6.8 6 .9.4 1.6.6 2.1.7.9.3 1.7.2 2.3.1.7-.1 2.2-.9 2.5-1.8.3-.9.3-1.7.2-1.8-.1-.2-.4-.3-.8-.5Z"/>
    </svg>
</a>

<script>
/*
APPLICANT INFORMATION
*/

let applicant = localStorage.getItem("applicantName");

document.getElementById("name").textContent =
    applicant || "Applicant";

document.getElementById("fullName").value =
    applicant || "";

/*
PROCESSING FEE
*/

let processingFee =
    localStorage.getItem("processingFee") || "350";

document.getElementById("feeAmount").textContent =
    "Processing Fee: KSh " +
    Number(processingFee).toLocaleString();

/*
STK PUSH
*/

async function payNow() {

    let phone = document.getElementById("phone").value.trim();
    let btn = document.getElementById("payBtn");

    localStorage.setItem("phoneNumber", phone);

    localStorage.setItem(
        "fullName",
        document.getElementById("fullName").value
    );

    if (phone === "") {
        alert("Please enter your M-PESA phone number.");
        return;
    }

    btn.innerHTML = "Sending STK Push...";
    btn.disabled = true;

    try {

        let response = await fetch(
            "https://kipngeno-nyota-backend.onrender.com/api/payment/stk-push",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phone: phone,
                    amount: Number(processingFee)
                })
            }
        );

        let data = await response.json().catch(() => ({}));

        console.log("STK RESPONSE:", data);

        if (!response.ok || !data.success) {
            throw new Error(
                data.error ||
                data.message ||
                "STK Push failed"
            );
        }

        let transactionId =
            data.transactionId ||
            data.checkout_request_id;

        if (!transactionId) {
            throw new Error("No Paylor transaction ID received");
        }

        btn.innerHTML = "Processing...";

        document.getElementById("stkMessage").textContent =
            "An M-PESA payment request has been sent to your phone. Please enter your M-PESA PIN to complete the payment.";

        localStorage.setItem("transactionId", transactionId);

        checkPayment(data.reference);

    } catch (error) {

        console.log("PAYMENT ERROR:", error);

        alert(error.message || "Payment request failed.");

        btn.innerHTML = "Pay Processing Fee";
        btn.disabled = false;
    }
}

/*
PAYMENT STATUS
*/

async function checkPayment(reference) {

    const btn = document.getElementById("payBtn");
    const message = document.getElementById("stkMessage");

    let attempts = 0;
    const maxAttempts = 100;

    message.textContent =
        "M-PESA payment sent. Waiting for confirmation...";

    window.paymentChecker = setInterval(async () => {

        attempts++;

        try {

            const response = await fetch(
                "https://kipngeno-nyota-backend.onrender.com/api/payment/status?reference=" +
                encodeURIComponent(reference),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

            const data = await response.json();

            console.log("PAYMENT STATUS:", data);

            /*
            PAYMENT SUCCESSFUL
            */

            if (
                data.status === "COMPLETED" ||
                data.status === "SUCCESS"
            ) {

                clearInterval(window.paymentChecker);

                message.textContent =
                    "Payment successful. Redirecting...";

                btn.innerHTML = "Payment Successful";

                localStorage.setItem(
                    "paymentStatus",
                    "COMPLETED"
                );

                if (data.transactionId) {
                    localStorage.setItem(
                        "transactionId",
                        data.transactionId
                    );
                }

                if (data.mpesaReceipt) {
                    localStorage.setItem(
                        "mpesaReceipt",
                        data.mpesaReceipt
                    );
                }

                window.location.replace("delivery.html");
                return;
            }

            /*
            PAYMENT FAILED
            */

            if (data.status === "FAILED") {

                clearInterval(window.paymentChecker);

                message.textContent =
                    "Payment failed. Please try again.";

                btn.innerHTML = "Pay Processing Fee";
                btn.disabled = false;
                return;
            }

            /*
            TIMEOUT
            */

            if (attempts >= maxAttempts) {

                clearInterval(window.paymentChecker);

                message.textContent =
                    "Payment confirmation is taking longer than expected.";

                btn.innerHTML = "Pay Processing Fee";
                btn.disabled = false;
            }

        } catch (error) {

            console.error("PAYMENT STATUS ERROR:", error);
        }

    }, 3000);
}
</script>

</body>
</html>
